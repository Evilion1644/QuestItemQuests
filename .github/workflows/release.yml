name: Validate, package and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua syntax checker
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Test release safeguards
        run: python -m unittest discover -s tests -v
      - name: Test addon, guide and data
        run: |
          lua5.1 tools/verify_build.lua
          lua5.1 tests/run.lua
          lua5.1 tests/guide.lua
      - name: Validate sources and generate English changelog
        run: python scripts/release.py prepare
      - name: Build without publishing
        uses: BigWigsMods/packager@v2
        env:
          # Avoid Packager skipping a main push whose commit also has a tag.
          GITHUB_EVENT_NAME: workflow_dispatch
        with:
          args: -d -e -l -u -g 1.60.1 -w 0 -a 0 -n "QLens-{project-version}-forever"
      - name: Validate the actual ZIP
        run: python scripts/release.py verify
      - uses: actions/upload-artifact@v4
        with:
          name: QLens-${{ github.sha }}
          path: |
            .release/*.zip
            .build/CHANGELOG.md
          include-hidden-files: true
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Configure required reviewers here if every release needs approval.
    environment: curseforge
    concurrency:
      group: curseforge-QuestItemQuests
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: QLens-${{ github.sha }}
          path: .
      - name: Install Lua syntax checker
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check exact Forever version, claim release and upload once
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py publish
